name: Yuji Web Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run basic tests
        run: python examples/basic_test.py --url ${{ vars.TEST_URL || 'https://saas-lead-generator-production.up.railway.app' }}
        continue-on-error: true

      - name: Run lead generator smoke tests
        run: python examples/lead_generator_test.py
        continue-on-error: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-screenshots
          path: /tmp/yuji-screenshots/

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-reports
          path: /tmp/yuji-reports/
